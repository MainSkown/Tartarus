# Only the settings Tartarus changes; everything else is libvirt's built-in default.

# The backend's qemu+tcp://cape/system connection. Bound to the internal compose network
# address only: on 0.0.0.0 the guest could reach libvirtd through its gateway address.
listen_tls = 0
listen_tcp = 1
tcp_port = "16509"
listen_addr = "${CAPE_INTERNAL_IP}"
auth_tcp = "none"

# CAPE's scheduler connects over the UNIX socket as the cape user (a member of libvirt).
unix_sock_group = "libvirt"
unix_sock_ro_perms = "0770"
unix_sock_rw_perms = "0770"
auth_unix_ro = "none"
auth_unix_rw = "none"
