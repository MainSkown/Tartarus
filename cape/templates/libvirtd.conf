# Only the settings Tartarus changes; everything else is libvirt's built-in default.

# libvirt's TCP endpoint is deliberately off (no --listen, no listen_tcp). It has no
# authentication, and this container is privileged, so any container on tartarus-internal
# reaching it would be host root. Nothing needs it before the guest wizard (M6); turning it on
# then means authentication (SASL or TLS client certificates) and a network shared only by
# cape and the backend. scripts/verify-cape.sh fails if it ever comes back unnoticed.

# CAPE's scheduler connects over the UNIX socket as the cape user (a member of libvirt).
unix_sock_group = "libvirt"
unix_sock_ro_perms = "0770"
unix_sock_rw_perms = "0770"
auth_unix_ro = "none"
auth_unix_rw = "none"
