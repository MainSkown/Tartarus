# Replaces the systemd units CAPE's installers set up (systemd/*.service in the CAPE tree).
# Every program logs to the container's stdout. Programs that need something another program
# provides start through wait-then-exec, since supervisord orders starts but not readiness.
# Anything that imports CAPE's Django settings needs the rooter and tt-guest: settings.py runs
# init_rooter() and init_routing(), which check both.

[program:virtlogd]
command=/usr/sbin/virtlogd
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:libvirtd]
command=/usr/sbin/libvirtd
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:guest-network]
command=/usr/local/lib/tartarus/start-guest-network
priority=30
autorestart=false
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cape-rooter]
command=/opt/CAPEv2/.venv/bin/python rooter.py --group cape
directory=/opt/CAPEv2/utils
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:inetsim]
command=/usr/local/lib/tartarus/wait-then-exec guest-network -- /usr/bin/inetsim --config /etc/inetsim/tartarus.conf
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:guacd]
command=/usr/local/sbin/guacd -f -b %(ENV_CAPE_INTERNAL_IP)s -l 4822 -L info
user=cape
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# The backend's way to end a run early: it cannot reach the guest agent, this container can.
# Listens on the internal address only, like guacd.
[program:finish-run]
command=/usr/local/lib/tartarus/wait-then-exec guest-network -- /usr/local/lib/tartarus/finish-run
user=cape
environment=GUEST_AGENT_URL="http://%(ENV_GUEST_IP)s:8000"
priority=45
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:suricata]
command=/usr/bin/suricata -c /etc/suricata/suricata.yaml --unix-socket
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api-token]
command=/usr/local/lib/tartarus/wait-then-exec rooter guest-network -- /usr/local/lib/tartarus/provision-api-token
user=cape
environment=HOME="/home/cape"
priority=50
autorestart=false
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:share-storage]
command=/usr/local/lib/tartarus/share-storage
user=cape
priority=45
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cape]
command=/usr/local/lib/tartarus/wait-then-exec guest-network rooter registered-guest -- /opt/CAPEv2/.venv/bin/python cuckoo.py
directory=/opt/CAPEv2
user=cape
environment=HOME="/home/cape"
priority=50
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cape-processor]
command=/usr/local/lib/tartarus/wait-then-exec rooter guest-network -- /opt/CAPEv2/.venv/bin/python utils/process.py --parallel 2 auto
directory=/opt/CAPEv2
user=cape
environment=HOME="/home/cape",CAPE_PROCESSING_TIMEOUT="900"
priority=50
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# apiv2 only: Tartarus never serves CAPE's web UI, so no static files or ASGI/guac-web.
[program:cape-web]
command=/usr/local/lib/tartarus/wait-then-exec rooter guest-network -- /opt/CAPEv2/.venv/bin/gunicorn web.wsgi:application --workers 2 --timeout 180 --bind 127.0.0.1:8000 --bind %(ENV_CAPE_INTERNAL_IP)s:8000
directory=/opt/CAPEv2/web
user=cape
environment=HOME="/home/cape"
priority=50
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
