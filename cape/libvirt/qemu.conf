# Only the settings Tartarus changes; everything else is libvirt's built-in default
# (QEMU runs as the unprivileged libvirt-qemu user, with its seccomp sandbox on).

# The container is privileged, so a host AppArmor/SELinux driver would load per-guest profiles
# into the host kernel and leave them behind. Isolation comes from the container instead.
security_driver = "none"

# Enabling cgroup controllers below the container's own cgroup fails: it already holds processes
# (cgroup v2's no-internal-processes rule). The container's cgroup bounds the guest instead.
cgroup_controllers = [ ]

# The display is only for guacd in this container.
vnc_listen = "127.0.0.1"
