# Tartarus overrides, layered by CAPE over conf/default/reporting.conf.default.
# jsondump (on by default) writes the reports/report.json the backend reads; mongodb stays off.

# CAPE posts {"task_id": N} here once a report is written. The backend treats it as a hint and
# asks the API for the task's status. An unreachable backend is logged by the module and does
# not fail the task or the report.
# scripts/verify-guest.sh layers its own temporary listener over this in reporting.conf.d/.
[callback]
enabled = yes
url = http://backend:8000/internal/cape/callback
