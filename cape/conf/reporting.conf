# Tartarus overrides, layered by CAPE over conf/default/reporting.conf.default.
# jsondump (on by default) writes the reports/report.json the backend reads; mongodb stays off.

# Off: the callback would have the cape user, which parses hostile output, open a connection to the
# backend's API, and that user may reach the CAPE database only (guest_engine/egress.py). The backend
# polls the task's status instead, every 2 s while a task is active.
[callback]
enabled = no
