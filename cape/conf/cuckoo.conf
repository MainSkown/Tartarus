# Tartarus overrides, layered by CAPE over conf/default/cuckoo.conf.default.
# %(ENV:NAME)s is CAPE's own interpolation of the container environment. Addresses derived
# from GUEST_SUBNET are rendered into cuckoo.conf.d/ at start instead: they are not in the
# environment of processes started with `docker compose exec`.

[cuckoo]
machinery = kvm

[resultserver]
port = 2042

[timeouts]
default = 180
critical = 120

[database]
connection = postgresql://%(ENV:CAPE_DB_USER)s:%(ENV:CAPE_DB_PASSWORD)s@postgres:5432/%(ENV:CAPE_DB_NAME)s

[processing]
# Imported PCAPs carry the domains of real malware traffic; looking them up would leave the host.
resolve_dns = off
