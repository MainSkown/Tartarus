# Tartarus overrides, layered by CAPE over conf/default/api.conf.default.
# Only the backend calls apiv2, over the internal network, so per-user rate limits would only
# throttle its 2 s status polling.

[api]
token_auth_enabled = yes
ratelimit = no

[taskstatus]
enabled = yes

[cuckoostatus]
enabled = yes

[machinelist]
enabled = yes
