# Tartarus overrides, layered by CAPE over conf/default/web.conf.default.
# [guacamole] makes the scheduler record each task's VNC port; Tartarus runs its own guacd
# tunnel, so CAPE's guac web view stays unused.

[guacamole]
enabled = yes

[general]
# CAPE's default is 30 MB, too small for a PCAP import; 512 MB is the product's upload limit.
max_sample_size = 536870912
