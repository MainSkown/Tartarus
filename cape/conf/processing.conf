# Tartarus overrides, layered by CAPE over conf/default/processing.conf.default.

# CAPE's default looks every sample, dropped file and URL up at VirusTotal with a shared key. Nothing
# about a sample leaves the host, and the cape user has no route out to send it (guest_engine/egress.py).
[virustotal]
enabled = no

[url_analysis]
whois = no
