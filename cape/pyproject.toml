# Test and lint settings for the Python that runs inside the cape container (stdlib only, system
# python3 of the image): the guest engine and the control services. It reuses the backend's ruff rules.
[tool.ruff]
extend = "../backend/pyproject.toml"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001", "ARG002"]
"guest_engine/errors.py" = ["N818"]  # GuestNotFound, InvalidParameters, Conflict are the protocol's vocabulary
