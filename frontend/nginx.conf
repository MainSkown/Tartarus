# Docker's embedded DNS. Resolving the backend per request (via a variable in proxy_pass)
# lets nginx start, and survive backend restarts, without the backend being resolvable yet.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Defence in depth next to the backend's own guard: a page the analyst visits can reach this
# loopback port with a rebound DNS name (foreign Host) or a cross-site request (foreign Origin).
# $host has no port; [::1] keeps its brackets.
map $host $host_allowed {
    default      0;
    localhost    1;
    127.0.0.1    1;
    "[::1]"      1;
}

# Browsers send Origin on every cross-site POST and WebSocket handshake; curl and the
# healthchecks send none. Origin must be this very site: scheme, host and port as the browser typed them.
map "$http_origin|http://$http_host" $origin_foreign {
    default            1;
    "~^\|"             0;
    "~^([^|]+)\|\1$"   0;
}

# Reads (GET, HEAD, OPTIONS) of /api may come from anywhere, as the browser blocks the answer;
# a WebSocket handshake is a GET that is not blocked, so /ws is checked for every method.
map "$origin_foreign:$request_method:$uri" $refuse_origin {
    default                                   0;
    "~^1:(?!GET:|HEAD:|OPTIONS:)[A-Z]+:/api/"  1;
    "~^1:[A-Z]+:/ws/"                          1;
}

# Only the shell and the hashed assets are served here; the backend sets its own caching.
# An empty value makes nginx omit the header.
map $uri $cache_control {
    default            "";
    /index.html        "no-cache";
    /sw.js             "no-cache";
    /manifest.json     "no-cache";
    "~^/assets/"       "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    if ($host_allowed = 0) {
        return 421;
    }

    if ($refuse_origin) {
        return 403;
    }

    # Set once at server level and never in a location: a location with its own add_header drops
    # every inherited one.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control $cache_control;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sample uploads (POST /api/analyses) are malware binaries; the 1m default would reject them.
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Memory images are a few GB; streamed straight through, never spooled to nginx's disk.
    location = /api/analyses/import/memory-image {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 5g;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live feeds and the guest desktop stay open for the whole analysis; the 60s default
        # read timeout would drop idle sockets.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # The shell must be revalidated on every load so a new deploy is picked up; the hashed
    # files it references are what get cached (see $cache_control).
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
