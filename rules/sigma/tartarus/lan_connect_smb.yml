title: Process Connects To A Fake LAN Host Over SMB
id: ee02f7ee-579c-4de0-bda9-fdcb238a0c23
status: experimental
description: >-
    A process that is not a system one connected to a host of the fake local network on port 445
    (SMB: file shares, administrative shares and the remote service manager). The host is simulated, so the connection reached nothing real. A flow that
    no process can be named for is not matched, because the capture does not say who made it.
author: Tartarus
date: 2026-11-23
tags:
    - attack.lateral-movement
    - attack.t1021.002
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        LanSimulated: true
        DestinationPort: 445
        Image|exists: true
    filter_system:
        Image|endswith: '\svchost.exe'
    condition: selection and not filter_system
falsepositives:
    - A sample that only checks whether the port is open.
    - A Windows service that connects because the sample asked it to; the filter only drops svchost.exe.
level: informational
