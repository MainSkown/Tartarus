title: Process Connects To A Fake LAN Host Over WinRM
id: 2cf024f1-e282-49a1-99b0-b0ec6c3e8666
status: experimental
description: >-
    A process that is not a system one connected to a host of the fake local network on ports 5985 and 5986
    (WinRM: remote commands over HTTP or HTTPS). The host is simulated, so the connection reached nothing real. A flow that
    no process can be named for is not matched, because the capture does not say who made it.
author: Tartarus
date: 2026-11-23
tags:
    - attack.lateral-movement
    - attack.t1021.006
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        LanSimulated: true
        DestinationPort: [5985, 5986]
        Image|exists: true
    filter_system:
        Image|endswith: '\svchost.exe'
    condition: selection and not filter_system
falsepositives:
    - A sample that only checks whether the port is open.
    - A Windows service that connects because the sample asked it to; the filter only drops svchost.exe.
level: low
