title: One User Name Tried On Many Fake LAN Hosts
id: 8380aee6-4387-4b5c-b91a-d0bed3b7ec7f
status: experimental
description: >-
    One process tried the same user name, with whatever passwords, on several hosts of the fake
    local network within minutes. Tartarus derives the event (the host count and the window are in
    the ingest, app/ingest/lan_derived.py), so this rule fires on every such event and holds no
    threshold of its own.
author: Tartarus
date: 2026-11-23
tags:
    - attack.credential-access
    - attack.t1110.003
logsource:
    category: lan_credential_spray
    product: windows
detection:
    selection:
        LanSimulated: true
    condition: selection
falsepositives:
    - A sample that tries the one account it carries on every host it finds.
level: high
