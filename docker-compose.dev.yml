services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - tartarus-dev

  opensearch:
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - tartarus-dev

  backend:
    image: tartarus-backend:dev
    build:
      target: dev
    environment:
      ENVIRONMENT: development
    ports:
      - "127.0.0.1:8000:8000"
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: sync
          path: ./backend/alembic
          target: /app/alembic
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  frontend:
    image: tartarus-frontend:dev
    build:
      target: dev-stage
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports: !override
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/quasar.config.ts
        - action: rebuild
          path: ./frontend/src-pwa/package.json
        - action: rebuild
          path: ./frontend/src-pwa/package-lock.json

networks:
  # Docker publishes a port only from a network with a route out, and the two data networks have none,
  # so the databases join this one for their loopback ports in dev only.
  tartarus-dev:
    name: tartarus-dev
    driver: bridge
